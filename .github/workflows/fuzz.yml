name: Fuzz

# The Hypothesis properties and the authres differential at the nightly
# profile (100,000 examples per property; CONTRIBUTING.md).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  UV_VERSION: "0.13.5"
  HYPOTHESIS_PROFILE: nightly

jobs:
  fuzz:
    name: properties (nightly profile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.15"
          enable-cache: false
      - run: uv sync
      - run: uv run pytest tests/test_properties.py tests/test_differential.py

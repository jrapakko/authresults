version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # flit-core is also pinned by hash in build-constraints.txt; bump both by
    # hand together (see CONTRIBUTING.md).
    ignore:
      - dependency-name: flit-core
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        patterns: ["*"]
